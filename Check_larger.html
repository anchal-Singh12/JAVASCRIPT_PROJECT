<body>
   
    <script>
        function larger(num1,num2){
            if(num1>num2){
                return num1;
            }else{
                return num2;
            }
            //OR
            return num1>num2 ? num1:num2;
        }
        console.log(larger(3,5))
         console.log(larger(9888,5678))
          console.log(larger(39,54))

    </script>
</body>
