<!DOCTYPE html>

    <title>practice exercise</title>
</head>
<body>
    <script>
        function isOdd(num){
            
            let rem=num%2;
            let isOdd=rem==1;
            return isOdd;
        }
        console.log(isOdd(59));
        console.log(isOdd(77));
        console.log(isOdd(66));
        console.log(isOdd(5));
        
    </script>
    
</body>
