<!DOCTYPE html>
<html lang="en">
<head>
    >
    <title>practise_q</title>
    <style>
        #mybutton{
            height:50px;
            width:50px;
            font-size: 25px;
        }
        .odd{
            background-color: blue;
        }
        .even{
            background-color: brown;
        }
    </style>
</head>
<body>
    <h3 id="greet"></h3>
    <button id="mybutton" onclick="buttonPressed();"></button>
    <script>
        let noOfclick= localStorage.getItem('noOfclick') ||0;

            function buttonPressed(){
            let button=document.querySelector("#mybutton");
            noOfclick++;
            localStorage.setItem('noOfclick',noOfclick);
            updatebutton();
         }


            function updatebutton(){
                let button=document.querySelector('#mybutton')
            if(noOfclick %2===0){
                 button.classList.remove('odd');
                 button.classList.add('even')
            }else{
                button.classList.remove('even');
                 button.classList.add('odd');
            }
        
            button.innerText=noOfclick;
        }
    
    updatebutton();







    function doGreeting(person_name="Dear"){
    let date= new Date();
    let hrs=date.getHours();;
    let heading=document.querySelector("#greet");
    console.log(hrs);
    if(hrs>5 && hrs<12){
        heading.innerText=`Good Morning ${person_name}`;
    }else if(hrs>12 &&hrs<18){
        heading.innerText=`Good Afternoon  ${person_name}`;

    }else{
        heading.innerText=` Good night  ${person_name}`;   
    }
}
doGreeting( );
</script>
    
</body>
</html>
