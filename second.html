<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice set2</title>
    <link rel="stylesheet" href="second.css">
</head>
<body>
    <button class="bagbutton" onclick="cart_quantity++;
     document.querySelector('#cart_sum').innerText=`Your bag has ${cart_quantity} item`;">Add to bag</button>
    <button class="wishbutton" onclick="cart_quantity--;
     document.querySelector('#cart_sum').innerText=`Your bag has ${cart_quantity} item`;">move to wishlist❤️</button>
    <button class="bagbutton" onclick="cart_quantity+=2;
     document.querySelector('#cart_sum').innerText=`Your bag has ${cart_quantity} item`;">Add 1+1 sale item</button>
    <h1 id="cart_sum"></h1>

<script>
    let cart_quantity=6;
    document.querySelector("#cart_sum").
    innerText=`Your bag has ${cart_quantity} item`;
</script>
</body>
</html>
